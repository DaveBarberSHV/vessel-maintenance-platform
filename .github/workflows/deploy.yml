name: Deploy to Cloud Run

on:
  push:
    branches: [main]

env:
  PROJECT_ID: project-dbe3feed-c30f-4b89-a65
  REGION: us-west1
  SERVICE_NAME: fathom-polaris
  REPO_NAME: fathom-polaris
  # Dedicated runtime SA (Sept 2026 IAM hardening) -- see deploy/setup_cloud_run.sh
  # for why this must not be omitted: omitting --service-account below falls back
  # to the Compute Engine default SA and silently undoes that hardening.
  RUN_SA: fathom-polaris-run@project-dbe3feed-c30f-4b89-a65.iam.gserviceaccount.com

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}
          project_id: ${{ env.PROJECT_ID }}

      - uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Build and push image
        run: |
          # Workload Identity Federation credentials (external_account type)
          # don't get a quota project wired in automatically the way a
          # service-account key does. Confirmed this is the real cause, not
          # an IAM gap: Policy Troubleshooter showed the deployer SA's
          # storage.admin grant as effectively GRANTED, and there are no IAM
          # Deny policies anywhere in the resource hierarchy (project,
          # folder, or org) -- yet gcloud builds submit kept failing with
          # the same misleading "forbidden from accessing the bucket ...
          # serviceusage.services.use" error regardless.
          # `gcloud auth application-default set-quota-project` doesn't
          # work here -- it edits the canonical ADC file at a fixed path,
          # which google-github-actions/auth@v2 doesn't populate for a WIF
          # credential ("Application default credentials have not been set
          # up"). The gcloud CLI config property works with any credential
          # type instead.
          gcloud config set billing/quota_project "$PROJECT_ID"
          gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet
          IMAGE="${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPO_NAME}/${SERVICE_NAME}:${{ github.sha }}"
          gcloud builds submit --project="$PROJECT_ID" --tag "$IMAGE" .
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy "$SERVICE_NAME" \
            --project="$PROJECT_ID" \
            --image="$IMAGE" \
            --region="$REGION" \
            --platform=managed \
            --service-account="$RUN_SA" \
            --quiet
