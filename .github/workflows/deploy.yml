name: Deploy to Cloud Run

on:
  push:
    branches: [main]

env:
  PROJECT_ID: project-dbe3feed-c30f-4b89-a65
  REGION: us-west1
  SERVICE_NAME: fathom-polaris
  REPO_NAME: fathom-polaris
  # Dedicated runtime SA (Sept 2026 IAM hardening) -- see deploy/setup_cloud_run.sh
  # for why this must not be omitted: omitting --service-account below falls back
  # to the Compute Engine default SA and silently undoes that hardening.
  RUN_SA: fathom-polaris-run@project-dbe3feed-c30f-4b89-a65.iam.gserviceaccount.com

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}
          project_id: ${{ env.PROJECT_ID }}

      - uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Build and push image
        run: |
          # Deliberately NOT using `gcloud builds submit` here. That path
          # uploads source to an auto-created GCS staging bucket first,
          # and kept failing with "forbidden from accessing the bucket ...
          # serviceusage.services.use" no matter what was fixed --
          # Policy Troubleshooter confirmed both the relevant Storage
          # permission AND serviceusage.services.use as effectively
          # GRANTED for this SA, and confirmed no IAM Deny policies exist
          # anywhere in the resource hierarchy (project, folder, or org).
          # That combination points to a gcloud/Workload-Identity-
          # Federation quirk in how that specific upload path carries the
          # impersonated identity, not a real permission gap. Building
          # and pushing the image directly avoids Cloud Build's staging
          # bucket entirely -- GitHub's runner has Docker built in, and
          # `docker push` to Artifact Registry only needs
          # artifactregistry.writer, which the deployer SA already has.
          gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet
          IMAGE="${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPO_NAME}/${SERVICE_NAME}:${{ github.sha }}"
          docker build -t "$IMAGE" .
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy "$SERVICE_NAME" \
            --project="$PROJECT_ID" \
            --image="$IMAGE" \
            --region="$REGION" \
            --platform=managed \
            --service-account="$RUN_SA" \
            --quiet
